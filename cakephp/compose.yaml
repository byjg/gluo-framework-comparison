# CakePHP ships no Docker setup: this file is written by hand, for MySQL only.
# PHP runs on the host (bin/cake server).
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
